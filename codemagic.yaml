workflows:
  ionic-capacitor-ios:
    name: Vocab Trainer iOS
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 20.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - name: Replace Tailwind v4 with v3
        script: |
          npm uninstall tailwindcss @tailwindcss/vite
          npm install -D tailwindcss@3.4.17 postcss@8 autoprefixer@10

      - name: Patch vite.config.ts
        script: |
          cat > vite.config.ts << 'EOF'
          import react from '@vitejs/plugin-react';
          import path from 'path';
          import { defineConfig } from 'vite';

          export default defineConfig({
            plugins: [react()],
            resolve: {
              alias: {
                '@': path.resolve(__dirname, '.'),
              },
            },
          });
          EOF

      - name: Create postcss.config.js
        script: |
          cat > postcss.config.js << 'EOF'
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {},
            },
          };
          EOF

      - name: Create tailwind.config.js
        script: |
          cat > tailwind.config.js << 'EOF'
          export default {
            content: ['./index.html', './src/**/*.{js,ts,jsx,tsx}'],
            theme: { extend: {} },
            plugins: [],
          };
          EOF

      - name: Patch index.css for Tailwind v3
        script: |
          cat > src/index.css << 'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF

      - name: Build web app
        script: npm run build

      - name: Install Capacitor
        script: npx cap add ios || true

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App.xcarchive \
            archive

          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../VocabTrainer.ipa Payload/

    artifacts:
      - build/VocabTrainer.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - thanhkienagee@gmail.com
        notify:
          success: true
          failure: true