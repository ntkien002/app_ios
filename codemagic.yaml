workflows:
  ionic-capacitor-ios:
    name: Vocab Trainer iOS
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18.17.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ntkien.vocabtrainer"
        APP_NAME: "Vocab Trainer"
      ios_signing:
        distribution_type: ad_hoc        # Đổi thành app_store nếu muốn lên App Store
        bundle_identifier: com.ntkien.vocabtrainer

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Install Capacitor iOS
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios || true   # "|| true" để không lỗi nếu ios/ đã tồn tại

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - thanhkienagee@gmail.com   # Email của bạn trên Codemagic
        notify:
          success: true
          failure: true
